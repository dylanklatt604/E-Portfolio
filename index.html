<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dylan Klatt · Mechanical & Aerospace Engineering</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{margin:0;background:#FAFAFA;color:#111827;font-family:'Inter',-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
  
  /* Sticky Top Nav */
  nav{position:sticky;top:0;z-index:50;background:rgba(250,250,250,0.88);backdrop-filter:blur(12px);border-bottom:1px solid #EBECEF}
  .nav-in{max-width:1040px;margin:0 auto;padding:16px 24px;display:flex;align-items:center;justify-content:space-between}
  .brand{font-weight:700;font-size:17px;color:#111827;text-decoration:none;letter-spacing:-0.02em}
  .nav-links{display:flex;gap:24px;align-items:center}
  .nav-links a{font-size:13.5px;font-weight:500;color:#4B5563;text-decoration:none;transition:.2s}
  .nav-links a:hover{color:#111827}
  @media(max-width:640px){.nav-links a.hide-m{display:none}}

  /* Layout Container */
  .wrap{max-width:1040px;margin:0 auto;padding:0 24px}
  section{padding:72px 0}
  .eyebrow{font-size:11px;font-weight:700;letter-spacing:.14em;color:#9CA3AF;margin-bottom:8px;text-transform:uppercase}
  .sec-title{font-size:32px;font-weight:700;letter-spacing:-.02em;margin:0 0 28px;color:#111827}

  /* Scroll Reveal Animation */
  .an{opacity:0;transform:translateY(22px);transition:opacity .65s ease-out,transform .65s ease-out}
  .an.v{opacity:1;transform:none}

  /* 1. Hero / Intro Section */
  .hero{display:grid;grid-template-columns:1.15fr 0.85fr;gap:48px;align-items:center;padding-top:64px;padding-bottom:80px}
  @media(max-width:860px){.hero{grid-template-columns:1fr;gap:40px;padding-top:44px}}
  .headline{font-family:'Lato',sans-serif;font-size:clamp(44px,6vw,68px);font-weight:700;color:#206A94;margin:0 0 26px;letter-spacing:-0.5px;min-height:1.2em}
  .bio{font-family:'Lato',sans-serif;font-size:clamp(18px,2.1vw,22px);font-weight:400;line-height:1.6;color:#1F1F1F}
  .bio-line{display:block;min-height:1.6em;margin-bottom:16px}
  .bio-line:last-child{margin-bottom:0}
  .cursor{display:inline-block;width:2px;margin-left:3px;animation:blink .8s infinite}
  .cursor-blue{background:#206A94}
  .cursor-dark{background:#1F1F1F}
  .hidden{display:none}
  @keyframes blink{0%,50%{opacity:1}51%,100%{opacity:0}}

  /* 3-Photo Bento Collage */
  .collage{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .collage img{width:100%;object-fit:cover;border-radius:16px;border:1px solid #E5E7EB;background:#E5E7EB;box-shadow:0 8px 24px rgba(0,0,0,.05);transition:transform .3s ease}
  .collage img:hover{transform:translateY(-3px)}
  .collage .tall{grid-row:span 2;height:414px;object-position:center 20%}
  .collage .sq{height:200px;object-position:center 25%}

  /* 2. Infinite Auto-Scrolling Technical Skills + Circular Arrow Controls */
  .tk-head{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:20px}
  .tk-ctrls{display:flex;gap:10px}
  .tk-btn{width:38px;height:38px;border-radius:50%;border:1px solid #E5E7EB;background:#FFF;color:#111827;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;transition:background .2s,border-color .2s,transform .15s;padding:0}
  .tk-btn:hover{background:#F3F4F6;border-color:#9CA3AF}
  .tk-btn:active{transform:scale(.94)}
  .marquee{display:flex;gap:16px;overflow-x:auto;padding:6px 2px 16px;scrollbar-width:none}
  .marquee::-webkit-scrollbar{display:none}
  .sk-card{flex:0 0 190px;background:#FFF;border:1.5px solid #EBECEF;border-radius:16px;padding:14px 14px 18px;text-align:center;transition:.2s}
  .sk-card:hover{border-color:#111827;transform:translateY(-2px)}
  .sk-box{height:70px;border-radius:12px;display:flex;align-items:center;justify-content:center;margin-bottom:14px}
  .sk-box img,.sk-box svg{width:38px;height:38px;object-fit:contain;border-radius:6px}
  .sk-box img.flag{width:54px;height:36px;border-radius:4px;box-shadow:0 1px 4px rgba(0,0,0,.1)}
  .p{background:#FDF0EA}.d{background:#F2F1EE}.i{background:#ECEFFC}.a{background:#FCF2DF}.g{background:#E7F5EC}.k{background:#E8F3FA}.o{background:#FCECEF}
  .sk-n{font-size:15px;font-weight:600;color:#111827;margin-bottom:5px}
  .sk-g{font-size:10.5px;font-weight:600;letter-spacing:.12em;color:#9CA3AF;line-height:1.3}

  /* 3. Credentials Grid */
  .cred-grid{display:flex;flex-wrap:wrap;justify-content:center;gap:18px}
  .cred-card{flex:0 1 calc(50% - 9px);min-width:320px;display:flex;align-items:center;gap:22px;background:#FFF;border:1px solid #E5E7EB;border-radius:16px;padding:24px 26px;transition:.2s}
  .cred-card:hover{border-color:#111827;box-shadow:0 6px 18px rgba(0,0,0,.04)}
  .cred-logo{flex:0 0 84px;width:84px;height:84px;display:flex;align-items:center;justify-content:center;background:#F9FAFB;border-radius:12px;border:1px solid #F3F4F6}
  .cred-logo img,.cred-logo svg{max-width:68px;max-height:58px;object-fit:contain;border-radius:4px}
  .cred-info{display:flex;flex-direction:column;align-items:flex-start}
  .cred-t{font-size:17px;font-weight:700;color:#111827;line-height:1.3;margin-bottom:5px}
  .cred-d{font-size:13.5px;color:#6B7280;line-height:1.45;margin-bottom:16px}
  .btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border:1px solid #D1D5DB;border-radius:999px;font-size:13px;font-weight:600;color:#111827;text-decoration:none;background:#FFF;transition:.2s}
  .btn:hover{border-color:#111827;background:#F9FAFB}

  /* 4. Experience & Education */
  .edu{display:flex;align-items:center;gap:20px;border:1px solid #E5E7EB;border-radius:16px;padding:22px 26px;background:#FFF;margin-bottom:24px}
  .ub{width:56px;height:56px;border-radius:12px;background:#002145;color:#FFF;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-weight:700;font-size:15px;letter-spacing:.04em}
  .et{font-size:20px;font-weight:700;margin:2px 0 4px}
  .es{font-size:13.5px;color:#4B5563}
  .row{display:flex;align-items:stretch;justify-content:space-between;gap:16px;padding:0 8px;border-top:1px solid #E5E7EB}
  .row:last-child{border-bottom:1px solid #E5E7EB}
